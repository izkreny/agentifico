# The raw scope, because Vale's markdown parse turns a task-list marker into an element the text scope never sees.
extends: existence
message: "A plan carries no checkboxes: write '%s' as a plain bullet, per Step 2 of workflows/open.md in the pr-flow skill."
level: error
scope: raw
nonword: true
tokens:
  - '(?m)^[ \t]*(?:[-*+]|\d+[.)])[ \t]+\[[ xX]\]'
