# A script rather than a regex, because the key a list item owes depends on the heading above it and on whether the item is nested, a fenced block must not move either, and a checkbox before the key is left for PlanCheckbox to report.
extends: script
message: "Every item under '## Steps', '## Verification' and '## Open questions' opens with its own section's key, as '- ::S1::', '- ::V1::' or '- ::Q1::', per Keys in the tracker skill's references/formats.md: '%s' does not."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  pos := 0
  key := ""
  content := -1
  fence := ""
  for line in text.split(scope, "\n") {
    stripped := text.trim_left(line, " \t")
    marker := text.re_find("^(`{3,}|~{3,})", stripped)
    if fence != "" {
      if marker != undefined && text.has_prefix(marker[0][1].text, fence) && text.trim_space(text.substr(stripped, len(marker[0][1].text))) == "" { fence = "" }
    } else if marker != undefined {
      fence = marker[0][1].text
    } else if text.re_match(`^#{1,6}[ \t]`, line) {
      key = ""
      content = -1
      if text.re_match(`^## Steps[ \t]*$`, line) { key = "S" }
      if text.re_match(`^## Verification[ \t]*$`, line) { key = "V" }
      if text.re_match(`^## Open questions[ \t]*$`, line) { key = "Q" }
    } else if key != "" {
      item := text.re_find(`^( {0,3})((?:[-*+]|\d+[.)])[ \t]+)\S`, line)
      if item != undefined && (content < 0 || len(item[0][1].text) < content) {
        content = len(item[0][1].text) + len(item[0][2].text)
        if !text.re_match(`^ {0,3}(?:[-*+]|\d+[.)])[ \t]+(?:\[[ xX]\][ \t]+)?::` + key + `[1-9]\d*::`, line) {
          matches = append(matches, {begin: pos, end: pos + len(line)})
        }
      }
    }
    pos += len(line) + 1
  }
