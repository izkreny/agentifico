# "Put a version next to the claim it qualifies, never as a banner at the top" in workflows/new.md: a banner ages into a lie because nothing updates it. The opening region is the first paragraph after the frontmatter, past a tools blockquote and a heading where a file opens with one, read on the raw source since only the raw scope knows where a file begins. No review in this repository's history caught a banner, so the tokens are borrowed: the TimeSensitive rule of jdkato/Prompts and the Timeless rule of the Google style calibrate "as of" and a dated claim, cut here to what a banner says, plus the shapes the tracker writes: a dated observation, "on 2026-09-06", eleven times across the issues, and "as of the commit this issue was filed against" #97. "currently" is History's alone, which reads it at any position, so an opening one raises one alert, not two.
# A version beside a claim further down, "(Claude Code 2.1.252)" in workflows/new.md, is the form the rule asks for and is out of reach, and "verified against the docs rather than assumed" is the verification idiom, excluded by its tail.
extends: existence
message: "Put a version next to the claim it qualifies: '%s' opens the file as a banner that nothing will update."
link: https://github.com/izkreny/agentifico/blob/main/skills/skills-guru/workflows/new.md
level: error
scope: raw
ignorecase: true
nonword: true
raw:
  - '(?<=\A(?:---\n[\s\S]*?\n---\n)?\s*(?:>[^\n]*\n)*\s*(?:#[^\n]*\n\s*)?[^\n]*?)\b(?:verified (?:against|with|on)|tested (?:with|against|on)|checked against|built against|works with v?\d|as of (?:\w+ )?\d{4}|(?:written|updated|last updated|reviewed|current) (?:on|in|as of) (?:\w+ )?\d{4}|on \d{4}-\d{2}-\d{2}|as of the (?:commit|tag|release)|the latest release on)\b(?![^\n]*rather than)[^\n]*'
tests:
  - name: fires on a banner after the frontmatter and a tools blockquote
    input: |
      ---
      name: x
      description: Use when.
      ---

      > **Tools used:** none

      Verified against Vale 3.20.0 on 2026-09-07.

      A later paragraph.
    want: |
      8:1:Agentifico.Banner:Put a version next to the claim it qualifies: 'Verified against Vale 3.20.0 on 2026-09-07.' opens the file as a banner that nothing will update.
  - name: fires on a banner under an opening heading with no frontmatter
    input: |
      # Reference

      Tested with v3 and currently correct.

      More.
    want: |
      3:1:Agentifico.Banner:Put a version next to the claim it qualifies: 'Tested with v3 and currently correct.' opens the file as a banner that nothing will update.
  - name: fires on a dated observation opening the file
    input: |
      # Notes

      On 2026-09-06 a status read reported four reviewed pull requests, as of the commit this was filed against.
    want: |
      3:1:Agentifico.Banner:Put a version next to the claim it qualifies: 'On 2026-09-06 a status read reported four reviewed pull requests, as of the commit this was filed against.' opens the file as a banner that nothing will update.
  - name: leaves the verification idiom alone
    input: |
      # Notes

      Verified against the plugin documentation rather than recalled.
    want: ""
  - name: leaves an opening currently to History
    input: |
      # Notes

      It currently reads the config.
    want: ""
  - name: leaves the frontmatter, a version beside its claim and a later dated claim alone
    input: |
      ---
      name: x
      description: Use when.
      compatibility: Requires Vale 3.20 or later, verified against 3.20.0.
      ---

      > **Tools used:** none

      A clean opening paragraph.

      The field is read (Claude Code 2.1.252), and as of 2026 the docs say so; this was tested with a real parser.
    want: ""
