# The counting half of the same rule as CommentSentences: a helper that points a reviewer at a comment long enough to be read for a second claim, not a verdict that it carries one, which is why it is a warning as ParagraphLength is. A scoped metric measures each comment on its own with Vale's words formula, a run of line comments counting as one. The cap is calibrated against this package by that count on 2026-09-15: its 118 comments ran to a median of 23 words and a maximum of 44, so 45 sits one word above the longest and names nothing in the package. Vale does not read a tool directive at all, so its reason never counts toward the cap.
# The scope is named in config/scopes/CommentProse.yml, with its reason.
extends: metric
message: "A comment inside code is one sentence saying why: this one runs to %s words, so read it for a second claim."
link: https://github.com/izkreny/agentifico/blob/main/skills/skills-guru/workflows/new.md
level: warning
scope: CommentProse
formula: words
condition: "> 45"
tests:
  - name: fires on a JavaScript comment over the cap, with its count
    format: js
    input: |
      // w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45
      const a = 1;
    want: |
      1:4:Agentifico.CommentLength:A comment inside code is one sentence saying why: this one runs to 46.00 words, so read it for a second claim.
  - name: fires on a Python comment over the cap
    format: py
    view: Python
    input: |
      # w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45
      x = 1
    want: |
      1:3:Agentifico.CommentLength:A comment inside code is one sentence saying why: this one runs to 46.00 words, so read it for a second claim.
  # No shebang, because Vale reads no module docstring under one and the case could then never fail.
  - name: leaves the module docstring alone
    format: py
    view: Python
    input: |
      """The first sentence says why. The second narrates the line. w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45

      Usage: python3 docstring-module.py <target>.
      """

      # The first sentence says why. The second narrates the line.


      class C:
          """The first sentence says why. The second narrates the line."""


      def f():
          """The first sentence says why. The second narrates the line."""
          return 1
    want: ""
  - name: leaves a comment at the cap alone
    format: js
    input: |
      // w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44
      const a = 1;
    want: ""
  - name: leaves a tool directive alone
    format: js
    input: |
      // biome-ignore lint/suspicious/noExplicitAny: w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45
      const a = 1;
      /* eslint-disable no-console w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45 */
      console.log(a);
    want: ""
  - name: leaves a string literal alone
    format: js
    input: |
      const s = "w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45";
    want: ""
  - name: leaves markdown alone, its HTML comment included
    input: |
      # Title

      <!-- The first sentence says why. The second narrates the line. w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45 -->

      The first sentence says why. The second narrates the line. w0 w1 w2 w3 w4 w5 w6 w7 w8 w9 w10 w11 w12 w13 w14 w15 w16 w17 w18 w19 w20 w21 w22 w23 w24 w25 w26 w27 w28 w29 w30 w31 w32 w33 w34 w35 w36 w37 w38 w39 w40 w41 w42 w43 w44 w45
    want: ""
