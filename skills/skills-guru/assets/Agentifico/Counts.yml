# The counting half of "Write sentences that survive change" in
# workflows/new.md: a count of adjacent content is a cache of the list beside
# it, and whoever adds an item edits the list, never the sentence. Each token
# is a shape a review caught in this repository, named by the pull request or
# commit that removed it. A cap ("five sentences at most", "three times at
# most in a round") constrains future content and is not matched: none of
# these shapes reaches "at most", "no more than" or "roughly".
extends: existence
message: "Write sentences that survive change: '%s' counts adjacent content, and the list is the authority on its own length."
link: https://github.com/izkreny/agentifico/blob/main/skills/skills-guru/workflows/new.md
level: error
ignorecase: true
tokens:
  # "all three forms" PR 27; "met all three" PR 116; "one of the three
  # prefixes" PR 87; "whichever of the two applies" PR 92; "two of the
  # general rules" PR 116; "either of two" and "one of those two" live in
  # plugins/gh-solo at the first run.
  - '(?:all|both of|each of|either of|neither of|one of|any of|which of|whichever of|two of|three of) (?:the |these |those |its |them )?(?:two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|twenty)'
  # "Two of them change what an agent does" #30; "Say which of the two it is"
  # .agents/gh-solo.md.
  - '(?:two|three|four|five) of them'
  # "the two caps above" PR 68; "the two traps" PR 116; "the three most
  # memorable ones" 187f851; "the two axes" and "the two hazards" ae1cd1a,
  # 600884c; "the three," ae1cd1a; "those two lists" live in plugins/gh-solo.
  - '(?:the|these|those|its) (?:two|three|four|five|six|seven|eight|nine|ten) [a-z]+'
  # "the three below" at three sites and "three above" 25ca57b.
  - '(?:two|three|four|five|six|seven|eight|nine|ten) (?:[a-z]+ )?(?:below|above)'
  # An enumeration announced by its number: "Three cures." 7b06a2e; "Two
  # lines matter:" ae1cd1a; "Two causes remain." f3af74d; "It runs in three
  # parts:" PR 46; "Two things sit outside it" PR 37. The closing shapes sit
  # in a lookahead, because Vale appends a word boundary to every token and
  # a boundary after the punctuation itself would never be satisfied.
  - '^(?:two|three|four|five|six|seven|eight|nine|ten) [a-z]+(?: [a-z]+)?(?=[:.]| remain| matter| sit| are| were)'
  - 'runs in (?:two|three|four|five|six) [a-z]+'
  # "Both checks are per stack" PR 86; "under both refusals above" PR 86;
  # "Both workflows end" and "required on both verdicts" ae1cd1a; nineteen
  # removals of "both" across eight commits. The nouns are the ones the
  # record and the first run over plugins/gh-solo carry, since a bare "both"
  # also counts things no edit can add to, "both directions" among them.
  - 'both (?:the |these |those )?(?:checks|workflows|verdicts|refusals|passes|rules|files|sections|steps|entries|bullets|items|paragraphs|lists|tables|halves|forms|cases|reads|loops|surfaces|conditions|sides|skills|threads|variables|results|lines|jobs|inputs|questions|addresses|counts|copies|names|fields|keys|manifests|commands|sources|reasons|tests|places|axes)\b'
  # "both needing a one-time npm ci and Vale" PR 155 RF1, 312f745: the count
  # went false the moment a third command, the lint, landed beside the two.
  - 'both needing'
  # "Both, like every validator that parses frontmatter" 783e1a9, counting
  # the two neighbours the paragraph before it enumerated.
  - '^both(?=,)'
tests:
  - name: fires on each recorded shape, once per line
    input: |
      # Title

      It covers all three forms of appointment.
      Reads the two caps above and the three most memorable ones.
      The standards are the three below.
      Two lines matter: the subject and the body.
      It runs in three parts: read, judge, post.
      Both checks are per stack rather than per branch.
      Take whichever of the two applies.
      Two of them change what an agent does, and both sources are named.
      Three cures.
      Its suite and its check, both needing a one-time install, run locally.
      Both, like every validator with a real parser, accept the truncation.
    want: |
      3:11:Agentifico.Counts:Write sentences that survive change: 'all three' counts adjacent content, and the list is the authority on its own length.
      4:7:Agentifico.Counts:Write sentences that survive change: 'the two caps' counts adjacent content, and the list is the authority on its own length.
      4:30:Agentifico.Counts:Write sentences that survive change: 'the three most' counts adjacent content, and the list is the authority on its own length.
      5:19:Agentifico.Counts:Write sentences that survive change: 'the three below' counts adjacent content, and the list is the authority on its own length.
      6:1:Agentifico.Counts:Write sentences that survive change: 'Two lines matter' counts adjacent content, and the list is the authority on its own length.
      7:4:Agentifico.Counts:Write sentences that survive change: 'runs in three parts' counts adjacent content, and the list is the authority on its own length.
      8:1:Agentifico.Counts:Write sentences that survive change: 'Both checks' counts adjacent content, and the list is the authority on its own length.
      9:6:Agentifico.Counts:Write sentences that survive change: 'whichever of the two' counts adjacent content, and the list is the authority on its own length.
      10:1:Agentifico.Counts:Write sentences that survive change: 'Two of them' counts adjacent content, and the list is the authority on its own length.
      10:44:Agentifico.Counts:Write sentences that survive change: 'both sources' counts adjacent content, and the list is the authority on its own length.
      11:1:Agentifico.Counts:Write sentences that survive change: 'Three cures' counts adjacent content, and the list is the authority on its own length.
      12:26:Agentifico.Counts:Write sentences that survive change: 'both needing' counts adjacent content, and the list is the authority on its own length.
      13:1:Agentifico.Counts:Write sentences that survive change: 'Both' counts adjacent content, and the list is the authority on its own length.
  - name: leaves caps, a bare both and code alone
    input: |
      # Title

      Five sentences or bullets at most, and three times at most in a round.
      An issue carries at most one value from each axis; under roughly 2,000 words one file is right.
      Read both, then report both in the handoff, in both directions.
      A cap of `the two files` inside a code span is code.
      Both are read, and each command needs Vale.
    want: ""
