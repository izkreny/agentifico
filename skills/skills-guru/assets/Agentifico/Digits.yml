# "Write a count from two to twenty in words" in workflows/new.md: a count written as a digit slips past every Counts token, so the digit is reported and the message names the word from the numbers list in assets/word-classes.yml, which the suite holds this swap to. The keys are shapes rather than mined phrasings, and their source is issue #228.
# Each key warns on a lone digit, and the reading decides whether it is a count, since no pattern tells a count from a name every time. Vale bounds each key with word boundaries, so a digit inside an id such as RF2 never matches, and one touching . - / : # ` or a comma is a version, a date, a time, an issue, a figure or a literal; a full stop ends that guard unless a digit follows it, so a digit closing a sentence still warns. A digit opening a block before ". " numbers a heading or a list item. A digit after step, section, line, chapter, row, item, layer, issue, version, question or Python names that thing, as does a digit continuing such a name through a comma, "and", "or" or "to"; without them every step number would warn. A literal, such as an exit code, goes in a code span, which Vale masks in prose and this guard covers in a code comment.
