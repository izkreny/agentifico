# "Write a count from two to twenty in words" in workflows/new.md: a count written as a digit slips past every Counts token, so the digit is reported and the message names the word from the numbers list in assets/word-classes.yml, which the suite holds this swap to. The keys are shapes rather than mined phrasings, and their source is issue #228.
# Each key reports a lone digit followed by a lowercase word, the count shape "3 files". A digit touching a letter, a digit or one of . - / : # is an id, a version, a date or a time, and a comma before a digit makes it a figure such as 2,000. A digit after step, section, line, chapter, row, item, layer, exit, issue, version or Python names that thing, as does a digit continuing such a name through a comma, "and", "or" or "to"; issue #228 names the first of those words, and a survey of the listed packages found the rest. A literal value, such as an exit code, is written in a code span, which Vale masks.
extends: substitution
message: "Write a count from two to twenty in words: write '%s' rather than '%s'."
link: https://github.com/izkreny/agentifico/blob/main/skills/skills-guru/workflows/new.md
