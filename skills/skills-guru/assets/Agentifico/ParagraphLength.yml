# The mechanical half of "Cut every paragraph to its one new claim" in workflows/new.md: a helper that points a reviewer at a paragraph long enough to be read for a second claim, not a verdict that it carries one. A scoped metric measures each body paragraph on its own with Vale's words formula, which is the count the message claims, and leaves a list item, a blockquote and a fenced block alone. The cap is calibrated against this package by that count, read through the package's own configuration on 2026-09-15: its 162 body paragraphs ran to a median of 46 words and a maximum of 119, so 120 sits one word above the longest and names nothing in the package. skills/rails-style and plugins/gh-solo taken whole, measured the same way, each sit under it at the 95th percentile of their paragraphs.
