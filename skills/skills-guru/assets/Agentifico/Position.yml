      26:1:Agentifico.Position:Write sentences that survive change: 'The last span' claims a position or uniqueness that any edit can falsify; name the section, file or member instead.
      27:55:Agentifico.Position:Write sentences that survive change: 'the second of them' claims a position or uniqueness that any edit can falsify; name the section, file or member instead.
  - name: leaves the sanctioned forms alone
    input: |
      # Title

      Each part below earns its place:
      One copy owns the fact and every other copy says so.
      "Never do X. Doing X is bad." The second sentence should say what breaks.
      Resume at the first unticked step, in the current directory, with the latest release.
      A footer that floats above the page is CSS, and the first of these that is set wins.
      The sections named under *Never counted* are excluded; `the table above` is code.
      Keep the shared layer in one place.
      The check leaves it alone, and a plan that names nothing later than its own branch is fine.
      A package root whose skills sit further down, and a version beside the claim it qualifies further down, are fine.
      The formats live with the tracker, and pr-flow and implement point here rather than restating them.
      The owner was away for the whole chain.
    want: ""
