# Vale's own Python queries at v3.23.0, from internal/lint/code/py.go, with the module docstring's query named so a rule can leave it out, for the reason assets/config/scopes/CommentProse.yml gives.
engine: tree-sitter
scopes:
  - expr: (comment)+ @comment
  - expr: |
      ((function_definition
        body: (block . (expression_statement (string) @docstring)))
       (#offset! @docstring 0 3 0 -3))
  - expr: |
      ((class_definition
        body: (block . (expression_statement (string) @docstring)))
       (#offset! @docstring 0 3 0 -3))
  - name: module
    expr: |
      ((module . (expression_statement (string) @docstring))
       (#offset! @docstring 0 3 0 -3))
