# StylesPath is relative to this file, so the check can point at it from any working directory with --config.
StylesPath = assets
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Agentifico
# Text inside double quotes is someone else's words or a quoted example, which is how workflows/new.md and workflows/review.md state the phrases they ban.
TokenIgnores = ("[^"\n]+"), (“[^”\n]+”)
# The file-length rules measure a SKILL.md, which is the file the cap in workflows/new.md is about, and no other file.
Agentifico.SkillSplit = NO
Agentifico.SkillLength = NO

[**/SKILL.md]
# A later section's BasedOnStyles replaces the earlier one's rather than adding to it, so the style is named again.
BasedOnStyles = Agentifico
Agentifico.SkillSplit = YES
Agentifico.SkillLength = YES
