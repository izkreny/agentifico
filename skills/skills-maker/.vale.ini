# The prose half of the check: Vale, run by scripts/check.js over the same
# files as markdownlint, with this package's own style and nothing fetched.
# StylesPath is relative to this file, so the check can point at it from any
# working directory with --config.
StylesPath = assets
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Agentifico
# Text inside double quotes is someone else's words or a quoted example, which
# is how workflows/new.md and workflows/review.md state the phrases they ban
# without the rules firing on the statement. A defect written inside quotes
# escapes the check, and the review reads for that.
TokenIgnores = ("[^"\n]+"), (“[^”\n]+”)
# The file-length rules measure a SKILL.md, which is the file the cap in
# workflows/new.md is about; every other file is prose that the skill loads
# on demand and the cap does not reach.
Agentifico.SkillSplit = NO
Agentifico.SkillLength = NO

[**/SKILL.md]
# A later section's BasedOnStyles replaces the earlier one's rather than
# adding to it, so the style is named again here.
BasedOnStyles = Agentifico
Agentifico.SkillSplit = YES
Agentifico.SkillLength = YES
