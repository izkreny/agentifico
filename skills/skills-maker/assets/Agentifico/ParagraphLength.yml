# The mechanical half of "Cut every paragraph to its one new claim" in
# workflows/new.md: a helper that points a reviewer at a paragraph long enough
# to be read for a second claim, not a verdict that it carries one. A scoped
# metric measures each body paragraph on its own with Vale's words formula,
# which is the count the message claims, and leaves a list item, a blockquote
# and a fenced block alone. The cap was calibrated against this package on
# 2026-09-07, where 84 body paragraphs ran to a median of 41 words and a
# maximum of 135, so 120 named the three longest and nothing else; measured
# again with the words formula on 2026-09-15, its 161 body paragraphs ran to
# a median of 47 and a maximum of 120, so the cap sits at the longest one.
# Two other skill collections measured on the first date sat under it at
# their 95th percentile.
extends: metric
message: "Cut every paragraph to its one new claim: this one runs to %s words, so read it for a second claim."
link: https://github.com/izkreny/agentifico/blob/main/skills/skills-maker/workflows/new.md
level: warning
scope: paragraph
formula: words
condition: "> 120"
